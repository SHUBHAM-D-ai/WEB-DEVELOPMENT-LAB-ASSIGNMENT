
<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>student Expense Tracker</h1>
<p class="text">student daily spending record</p>

<div class="box">
    <h2>Total Expense</h2>
    <h3>Rs. 850</h3>
</div>

<div class="box">
    <h2>Add Expense</h2>

    <input type="text" placeholder="Expense name">
    <input type="number" placeholder="Amount">

    <select>
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Education</option>
        <option>Other</option>
    </select>

    <button>Add Expense</button>
</div>

<div class="box">
    <h2>My Expenses</h2>

    <div class="item">
        <span>Canteen</span>
        <span>Rs. 120</span>
    </div>

    <div class="item">
        <span>Bus Fare</span>
        <span>Rs. 50</span>
    </div>

    <div class="item">
        <span>Notebook</span>
        <span>Rs. 180</span>
    </div>

    <div class="item">
        <span>Cold Coffee</span>
        <span>Rs. 90</span>
    </div>

    <div class="item">
        <span>Shopping</span>
        <span>Rs. 410</span>
    </div>
</div>

</body>
</html>
